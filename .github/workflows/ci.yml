name: ci

# Every branch push checks every target. A PR from a branch of this
# repository already has that push run on its head commit, so its jobs skip
# the pull_request run; PRs from forks run there. A newer push cancels the
# branch's earlier run, except on main, where each commit keeps its result.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  windows-x86:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    # No preset here. The Visual Studio presets pin a generator version that
    # tracks the developer's local install, while the Ninja preset needs a
    # developer command prompt. Letting CMake pick the runner's default
    # generator keeps this job working as the runner image moves.
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/ci -A Win32 -DRE2DJ_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build/ci --config Debug
      - name: Test
        run: ctest --test-dir build/ci -C Debug --output-on-failure

  linux-x64:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          ninja-build
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev
          libxi-dev libxss-dev libxtst-dev
          libwayland-dev libwayland-egl-backend-dev libxkbcommon-dev
          libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev
          libdrm-dev libgbm-dev
          libasound2-dev libpulse-dev libpipewire-0.3-dev libudev-dev
      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: cmake --preset linux-x64-debug -DRE2DJ_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset linux-x64-debug
      - name: Test
        run: ctest --preset linux-x64-debug

  # The i386 product host, built natively in the Debian 12 container the
  # release uses. JavaScript actions cannot run inside a 32-bit container, so
  # only the build goes into it; Docker's default seccomp profile refuses the
  # modify_ldt the guest runtime needs.
  linux-x86:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test in an i386 container
        run: >-
          docker run --rm --security-opt seccomp=unconfined
          -v "$GITHUB_WORKSPACE:/src" -w /src i386/debian:bookworm
          setarch i686 bash -c '
          set -euo pipefail;
          apt-get update;
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
          ca-certificates git cmake ninja-build g++ make pkg-config
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev
          libxi-dev libxss-dev libxtst-dev
          libwayland-dev libwayland-egl-backend-dev libxkbcommon-dev
          libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev
          libdrm-dev libgbm-dev
          libasound2-dev libpulse-dev libpipewire-0.3-dev libudev-dev;
          git config --global --add safe.directory "*";
          cmake --preset linux-x86-debug -DRE2DJ_WARNINGS_AS_ERRORS=ON;
          cmake --build --preset linux-x86-debug;
          SDL_AUDIODRIVER=dummy ctest --preset linux-x86-debug'
