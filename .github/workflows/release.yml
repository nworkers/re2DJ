name: Release

# Build the Windows x86, Linux x86-64 and Linux x86 distributions for every
# v* tag, then publish them together. A manual run is useful for checking the
# packages, but it does not publish a GitHub Release without a tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Compare VERSION with the tag
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must use major.minor.patch format, found '$version'."
            exit 1
          fi
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="${{ github.ref_name }}"
            if [[ "${tag#v}" != "$version" ]]; then
              echo "::error::VERSION file and tag disagree."
              echo "  VERSION file : $version"
              echo "  tag          : $tag (reads as ${tag#v})"
              exit 1
            fi
            echo "Tag $tag matches VERSION $version."
          else
            echo "Manual run; using VERSION $version without a tag comparison."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows-x86:
    name: Windows x86 Release build and package
    needs: version
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore FetchContent dependency cache
        uses: actions/cache@v4
        with:
          path: build/windows-x86/_deps
          key: deps-windows-2022-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            deps-windows-2022-

      # No preset here, as in ci.yml: the Visual Studio preset pins the
      # generator of the developer's local install (Visual Studio 18 2026),
      # which the runner image need not have. CMake picks the runner's own
      # Visual Studio; build/windows-x86 is the preset's binaryDir, which
      # package_release.ps1 reads.
      - name: Configure
        shell: powershell
        run: cmake -S . -B build/windows-x86 -A Win32 -DRE2DJ_WARNINGS_AS_ERRORS=ON -DRE2DJ_BUILD_TESTS=ON

      - name: Build (Release)
        shell: powershell
        run: cmake --build build/windows-x86 --config Release

      - name: Test (Release)
        shell: powershell
        # The full product lifecycle probe can wait for an original-device
        # boundary. Its deterministic VFS mode is run separately below.
        run: >-
          ctest --test-dir build/windows-x86 -C Release
          --output-on-failure -E re2dj_windows_vfs_runtime_probe

      # cmd rather than PowerShell, whose step showed none of the probe's
      # stderr when it failed.
      - name: Test VFS enumeration probe
        shell: cmd
        run: build\windows-x86\bin\Release\re2dj_windows_vfs_runtime_probe.exe --vfs-enumeration-only

      # When the probe dies without a message, as a CRT fast-fail does, run it
      # once more under the Windows SDK's debugger for the stack.
      - name: Diagnose the VFS enumeration probe
        if: failure()
        shell: powershell
        run: |
          $cdb = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x86\cdb.exe' -ErrorAction SilentlyContinue |
              Select-Object -First 1
          if ($null -eq $cdb) { Write-Host 'cdb.exe was not found on this runner.'; exit 0 }
          & $cdb.FullName -G -c "g; .lastevent; .ecxr; kn 40; lm; q" `
              build\windows-x86\bin\Release\re2dj_windows_vfs_runtime_probe.exe --vfs-enumeration-only
          exit 0

      - name: Package
        shell: powershell
        run: .\scripts\package_release.ps1 -Configuration Release -Version ${{ needs.version.outputs.version }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: re2dj-v${{ needs.version.outputs.version }}-windows-x86
          path: |
            build/package/*.zip
            build/package/*.sha256
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux ${{ matrix.arch }} Release build and package
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Debian 12 (glibc 2.36), older than the runner, so the executable
          # runs on that glibc and later.
          - arch: x64
            platform: linux-x64
            image: debian:bookworm
            personality: ''
          # A native i386 toolchain. JavaScript actions cannot run inside a
          # 32-bit container, so only the build goes into it; setarch makes
          # uname report i686 to CMake.
          - arch: x86
            platform: linux-x86
            image: i386/debian:bookworm
            personality: setarch i686
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Restore FetchContent dependency cache
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.platform }}-release/_deps
          key: deps-${{ matrix.platform }}-bookworm-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            deps-${{ matrix.platform }}-bookworm-

      - name: Build, test and package in the container
        # The guest runs with an LDT code and FS selector, and Docker's
        # default seccomp profile refuses modify_ldt.
        run: >-
          docker run --rm --security-opt seccomp=unconfined
          -v "$GITHUB_WORKSPACE:/src" -w /src ${{ matrix.image }}
          ${{ matrix.personality }} bash -c '
          set -euo pipefail;
          apt-get update;
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
          ca-certificates git cmake ninja-build g++ make pkg-config file binutils
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev
          libxi-dev libxss-dev libxtst-dev
          libwayland-dev libwayland-egl-backend-dev libxkbcommon-dev
          libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev
          libdrm-dev libgbm-dev
          libasound2-dev libpulse-dev libpipewire-0.3-dev libdecor-0-dev;
          git config --global --add safe.directory "*";
          SDL_AUDIODRIVER=dummy bash scripts/build_release_linux.sh ${{ matrix.platform }} ${{ needs.version.outputs.version }};
          chown -R '"$(id -u):$(id -g)"' build'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: re2dj-v${{ needs.version.outputs.version }}-${{ matrix.platform }}
          path: |
            build/package/*.tar.gz
            build/package/*.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Create or update the GitHub Release
    needs: [version, windows-x86, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Gather the packages
        uses: actions/download-artifact@v4
        with:
          path: build/release
          merge-multiple: true

      - name: Create or update the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ github.ref_name }}'
          shopt -s nullglob
          files=(build/release/*.zip build/release/*.tar.gz build/release/*.sha256)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No release files were produced for $tag."
            exit 1
          fi
          printf 'Release file: %s\n' "${files[@]}"

          notes="docs/release-notes/$tag.md"
          if [[ -f "$notes" ]]; then
            echo "Using release notes from $notes."
          else
            echo "No $notes; falling back to generated notes."
          fi

          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            if [[ -f "$notes" ]]; then
              gh release edit "$tag" --notes-file "$notes"
            fi
          elif [[ -f "$notes" ]]; then
            gh release create "$tag" "${files[@]}" --title "$tag" --notes-file "$notes"
          else
            gh release create "$tag" "${files[@]}" --title "$tag" --generate-notes
          fi
