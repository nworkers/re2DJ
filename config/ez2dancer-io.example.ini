; EZ2Dancer 2nd MOVE keyboard mapping.
; Copy this file and pass it with --io-config <path>.
; Coin is intentionally omitted because its input port and bit are unresolved.

[buttons]
test=F1
service=F2

; Floor pads
p1_left=Z
p1_center=X
p1_right=C
p2_left=NUMPAD1
p2_center=NUMPAD2
p2_right=NUMPAD3

; Hand sensors
p1_sensor_top_left=Q
p1_sensor_top_right=W
p1_sensor_bottom_left=A
p1_sensor_bottom_right=S
p2_sensor_top_left=U
p2_sensor_top_right=I
p2_sensor_bottom_left=J
p2_sensor_bottom_right=K
