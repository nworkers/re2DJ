; EZ2Dancer 2nd MOVE keyboard mapping. These are re2DJ's built-in defaults, so
; this file is needed only to change something: pass it with --io-config and it
; overrides the entries it lists, leaving every other entry at its default.
; Write NONE for an entry to unbind that key.
; Coin increments the inferred compatibility counter exposed at 0x304.

[buttons]
coin=F5
test=F1
service=F2

; Floor pads
p1_left=Q
p1_center=S
p1_right=R
p2_left=NUMPAD1
p2_center=NUMPAD2
p2_right=NUMPAD3

; Hand sensors
p1_sensor_top_left=W
p1_sensor_top_right=E
p1_sensor_bottom_left=A
p1_sensor_bottom_right=D
p2_sensor_top_left=U
p2_sensor_top_right=I
p2_sensor_bottom_left=J
p2_sensor_bottom_right=K
