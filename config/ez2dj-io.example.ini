; EZ2DJ keyboard and gamepad mapping. These are re2DJ's built-in defaults, so
; this file is needed only to change something: pass it with --io-config and it
; overrides the entries it lists, leaving every other entry at its default.
; Write NONE for an entry to unbind that key or control.

[buttons]
test=F1
service=F2
coin=F5
effector1=Q
effector2=W
effector3=E
effector4=R
p1_start=1
p2_start=2
p1_1=Z
p1_2=S
p1_3=X
p1_4=D
p1_5=C
p1_pedal=SPACE
p2_1=NUMPAD1
p2_2=NUMPAD2
p2_3=NUMPAD3
p2_4=NUMPAD4
p2_5=NUMPAD5
p2_pedal=DECIMAL

[turntables]
p1_negative=LSHIFT
p1_positive=TAB
p2_negative=ENTER
p2_positive=RSHIFT
step=2

; Gamepad controls (Linux host; any connected pad): A B X Y BACK GUIDE START
; LSTICK RSTICK LB RB LT RT DPAD_UP DPAD_DOWN DPAD_LEFT DPAD_RIGHT PADDLE1..4
; LSTICK_LEFT LSTICK_RIGHT LSTICK_UP LSTICK_DOWN RSTICK_LEFT RSTICK_RIGHT
; RSTICK_UP RSTICK_DOWN. A pad plays player 1; player 2 is unbound.
[gamepad]
test=NONE
service=NONE
coin=BACK
effector1=DPAD_UP
effector2=DPAD_DOWN
effector3=DPAD_LEFT
effector4=DPAD_RIGHT
p1_start=START
p2_start=NONE
p1_1=X
p1_2=Y
p1_3=B
p1_4=A
p1_5=RB
p1_pedal=LB
p2_1=NONE
p2_2=NONE
p2_3=NONE
p2_4=NONE
p2_5=NONE
p2_pedal=NONE
p1_negative=LSTICK_LEFT
p1_positive=LSTICK_RIGHT
p2_negative=NONE
p2_positive=NONE
