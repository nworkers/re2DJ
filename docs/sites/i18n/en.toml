tagline = "Original EZ2DJ game code, as-is, on a modern PC."
lead = "re2DJ is an experimental runtime that executes the original EZ2DJ executable's 32-bit x86 code natively on Linux and 64-bit Windows, without an emulator or a virtual machine. Game logic stays in the original code; only the surrounding Win32 API, DirectX and hardware boundaries are replaced with High Level Emulation (HLE)."
latest = "Latest version"
cta_download = "Download"
cta_wip = "View progress"
warning = "This is research-stage software, not a finished game launcher. Some targets run until their window is closed; others may still stop at a boundary not yet modelled."

[about]
title = "Principles"
items = [
  "<strong>Preserve original logic</strong> — gameplay is not rewritten in C++; the original x86 code remains the primary execution path.",
  "<strong>Selective HLE</strong> — the boundary is the Win32 import thunk. Only APIs the game actually calls are implemented, narrowly.",
  "<strong>Multiplatform from the start</strong> — the shared core includes no host OS headers; Windows/Linux specifics live in platform layers.",
  "<strong>HDD and CHD input boundary</strong> — extracted HDDs arrive as a user-supplied directory; MAME CHDs are read through a read-only FAT32 layer.",
  "<strong>Originals stay untouched</strong> — guest file writes go to an overlay directory, so the original dump is never modified.",
  "<strong>Reproducible records</strong> — designs, work orders, analysis and work logs accumulate as repository documents.",
]

[how]
title = "How it works"
body = [
  "The launcher maps the original PE32 executable into memory, and the original code then runs directly on the host CPU. On Windows the original PE32 starts as the main image; on Linux it executes inside the same process (x86-64 uses CPU compatibility mode).",
  "Only when the code touches a Win32 API, DirectX, a hardware port or the Hardlock dongle does the HLE layer intercept, answer with the virtual file system, the graphics and sound facades or a device model, and return to the original code.",
]

