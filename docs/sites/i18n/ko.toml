original_body = "EZ2DJ는 1999년 Amuse World가 처음 선보인 아케이드 리듬 게임이며, EZ2Dancer는 같은 계보의 댄스 게임입니다. EZ2DJ·EZ2Dancer와 관련된 모든 상표와 저작물의 권리는 각 권리자에게 있습니다. re2DJ는 비공식 보존·연구 프로젝트로 권리자와 아무 관계가 없으며, 원본 실행 파일·HDD 덤프·CHD를 포함하거나 배포하지 않습니다. 이 게임들을 만들고 지금까지 이어온 모든 분들께 감사드립니다."
mame_note = "<a href=\"https://www.mamedev.org/\">MAME</a>에는 re2DJ가 읽는 CHD 디스크 이미지 포맷과 수십 년의 아케이드 보존 작업에 감사드립니다. MAME 코드는 이식하지 않았으며, CHD 읽기는 libchdr로 합니다."
