[hero]
command = "re2dj.exe ez2dj1st"
tagline = "원본 EZ2DJ 게임 코드를, 그대로, 현대 PC에서."
lead = "re2DJ는 에뮬레이터나 가상 머신을 동원하지 않고, 원본 EZ2DJ 실행 파일의 32비트 x86 코드를 Linux와 64비트 Windows에서 네이티브로 실행하는 실험적 런타임입니다. 게임 로직은 원본 코드에 그대로 두고, 그 주변의 Win32 API·DirectX·하드웨어 경계만 High Level Emulation(HLE)으로 대신합니다."
latest = "최신 버전"
cta_download = "다운로드"
cta_wip = "진행 상황 보기"
warning = "연구·개발 단계의 소프트웨어이며 완성된 게임 런처가 아닙니다. 일부 타깃은 창을 닫을 때까지 실행되고, 다른 타깃은 아직 모형이 없는 경계에서 멈출 수 있습니다."

[about]
title = "원칙"
items = [
  "<strong>원본 로직 보존</strong> — 게임플레이를 C++로 다시 쓰지 않고 원본 x86 코드를 주 실행 경로로 유지합니다.",
  "<strong>선별적 HLE</strong> — 경계는 Win32 import thunk입니다. 게임이 실제로 호출하는 API만 좁은 범위로 구현합니다.",
  "<strong>처음부터 멀티플랫폼</strong> — 공용 코어는 호스트 OS 헤더를 포함하지 않고, Windows/Linux 세부 구현은 플랫폼 계층에 분리합니다.",
  "<strong>HDD·CHD 입력 경계</strong> — 추출 HDD는 사용자가 지정한 디렉터리로 받고, MAME CHD는 read-only FAT32 계층으로 읽습니다.",
  "<strong>원본 무변경 보장</strong> — 게스트의 파일 쓰기는 overlay 디렉터리로 향하므로 원본 덤프는 그대로 유지됩니다.",
  "<strong>재현 가능한 기록</strong> — 설계, 작업 지시, 분석과 작업 로그를 저장소 문서로 누적합니다.",
]

[how]
title = "동작 방식"
body = [
  "런처가 원본 PE32 실행 파일을 메모리에 배치하면, 원본 코드는 호스트 CPU에서 그대로 실행됩니다. Windows에서는 원본 PE32가 main image로 시작되고, Linux에서는 같은 프로세스 안에서 실행됩니다(x86-64는 CPU compatibility mode).",
  "코드가 Win32 API나 DirectX, 하드웨어 port, Hardlock 동글에 닿는 순간에만 HLE 계층이 가로채 가상 파일 시스템, 그래픽·사운드 facade, 장치 모형으로 응답한 뒤 원본 코드로 돌려보냅니다.",
]

