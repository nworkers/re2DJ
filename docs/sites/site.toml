# Language-neutral settings for the re2DJ project site (Task 432).
# Language-specific text lives in i18n/<lang>.toml.

[site]
name = "re2DJ"
repo = "nworkers/re2DJ"
branch = "main"
# Overridden in CI by actions/configure-pages (base_url).
default_url = "https://nworkers.github.io/re2DJ/"
default_lang = "ko"
languages = ["ko", "en"]

[sources]
posts = "docs/post"
release_notes = "docs/release-notes"
# The target list is read from the built-in catalog so the site never drifts from the code.
target_catalog = "src/target/target_profile.cpp"

[mermaid]
# Loaded from jsDelivr only on pages that contain a diagram (MIT).
url = "https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.esm.min.mjs"

# Credits page entries (Task 433). Language-neutral facts only; group titles and
